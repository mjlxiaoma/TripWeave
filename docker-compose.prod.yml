# TripWeave 生产编排：nginx(80) -> api(内网) -> postgres+redis(内网)。
# 与根 docker-compose.yml（本地开发，只起 pg+redis 到 127.0.0.1）互不影响。
#
# 用法：cp deploy/.env.example .env.prod && 填入机密后
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tripweave
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env.prod}
      POSTGRES_DB: tripweave
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripweave"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?set in .env.prod}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend]

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      APP_ENV: production
      ADDR: ":8080"
      # 内网服务名寻址；端口是容器内端口
      DATABASE_URL: postgres://tripweave:${DB_PASSWORD}@postgres:5432/tripweave?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MIGRATE_DIR: file:///app/migrations
      RUN_MIGRATE: "true"
      # 机密由 env_file 注入（见下）
    env_file: .env.prod
    volumes:
      - ./migrations:/app/migrations:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [backend]

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
      args:
        # 前端构建期注入的高德 JS key（服务端 key 走 api 的 env_file，不进这里）
        VITE_AMAP_KEY: ${VITE_AMAP_KEY:-}
        VITE_AMAP_SECURITY_CODE: ${VITE_AMAP_SECURITY_CODE:-}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "80:80"
      # 拿到域名 + 证书后再放开 443（届时 nginx.conf 加 SSL server 块）
      # - "443:443"
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
