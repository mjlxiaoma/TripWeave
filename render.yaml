# TripWeave Render 蓝图（Infrastructure as Code）。
# Render Dashboard → New → Blueprint → 选本仓库即可一键创建两个服务。
#
# 外部依赖（在 Render Dashboard 手动填，sync:false）：
#   - Neon PostgreSQL：DATABASE_URL（含 sslmode=require）
#   - Upstash Redis：REDIS_ADDR（host:port）+ REDIS_PASSWORD（REDIS_TLS 已默认 true）
#   - DeepSeek / 高德 / SMTP 机密

services:
  # Go API（Docker 部署，免费档，新加坡区离国内最近）
  - type: web
    name: tripweave-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    # 免费档 512MB，Go 静态二进制足够
    envVars:
      - key: APP_ENV
        value: production
      - key: ADDR
        value: ":8080"
      - key: RUN_MIGRATE
        value: "true"
      - key: MIGRATE_DIR
        value: file:///app/migrations
      - key: REDIS_TLS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 30m
      - key: REFRESH_TOKEN_TTL
        value: 720h
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: AI_MAX_TOOL_ROUNDS
        value: "5"
      - key: SMTP_HOST
        value: smtp.qq.com
      - key: SMTP_PORT
        value: "465"
      # 以下在 dashboard 手动填（sync:false = 不入库不泄露）
      - key: DATABASE_URL
        sync: false
      - key: REDIS_ADDR
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: AMAP_SERVICE_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # 前端静态站（Render 免费静态托管 + 自动 HTTPS；static 类型不支持 region 字段）
  - type: web
    name: tripweave-web
    runtime: static
    buildCommand: corepack enable && corepack prepare pnpm@11.4.0 --activate && pnpm install --frozen-lockfile && pnpm --filter web build
    staticPublishPath: apps/web/dist
    plan: free
    routes:
      # SPA history 路由：全部回退到 index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false   # 填 https://tripweave-api.onrender.com/api/v1
      - key: VITE_AMAP_KEY
        sync: false
      - key: VITE_AMAP_SECURITY_CODE
        sync: false
